<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A fully automated micro-blog: daily AI tools, open-source models and indie hacker signals, generated by Gemini and GitHub Actions." />
  <title>NichePulse — AI &amp; Indie Hacker Signals</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <style>
    .md-body { font-size: 0.95rem; line-height: 1.75; color: #d4d4d8; }
    .md-body h2 { margin-top: 1.5rem; margin-bottom: .5rem; font-size: 1.25rem; font-weight: 700; color: #f4f4f5; }
    .md-body h3 { margin-top: 1.25rem; margin-bottom: .5rem; font-size: 1.05rem; font-weight: 600; color: #f4f4f5; }
    .md-body p { margin: .75rem 0; }
    .md-body ul, .md-body ol { margin: .75rem 0; padding-left: 1.25rem; }
    .md-body ul { list-style: disc; }
    .md-body ol { list-style: decimal; }
    .md-body li { margin: .25rem 0; }
    .md-body a { color: #34d399; text-decoration: underline; text-underline-offset: 2px; }
    .md-body blockquote { border-left: 3px solid #34d399; padding-left: 1rem; color: #a1a1aa; font-style: italic; margin: .75rem 0; }
    .md-body code { background: #27272a; padding: .1rem .35rem; border-radius: .375rem; font-size: .85em; }
    .md-body pre { background: #18181b; border: 1px solid #27272a; padding: 1rem; border-radius: .75rem; overflow-x: auto; margin: .75rem 0; }
    .md-body pre code { background: none; padding: 0; }
    .md-body hr { border-color: #27272a; margin: 1.5rem 0; }
    .md-body strong { color: #f4f4f5; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased min-h-screen flex flex-col">

  <header class="sticky top-0 z-10 border-b border-zinc-800/60 bg-zinc-950/80 backdrop-blur">
    <div class="mx-auto max-w-3xl px-5 py-6 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight">NichePulse<span class="text-emerald-400">.</span></h1>
        <p class="mt-0.5 text-sm text-zinc-400">Daily AI tools, open-source models &amp; indie hacker signals.</p>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <a href="feed.xml" class="rounded-full border border-zinc-700 bg-zinc-900 px-3 py-1 text-zinc-400 hover:text-emerald-300 hover:border-emerald-500/60 transition-colors">RSS</a>
        <a href="index.json" class="rounded-full border border-zinc-700 bg-zinc-900 px-3 py-1 text-zinc-400 hover:text-emerald-300 hover:border-emerald-500/60 transition-colors">JSON</a>
      </div>
    </div>
  </header>

  <div class="mx-auto w-full max-w-3xl px-5 pt-8">
    <input
      id="search"
      type="search"
      placeholder="Search posts or tags…"
      autocomplete="off"
      class="w-full rounded-xl border border-zinc-800 bg-zinc-900/60 px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 outline-none focus:border-emerald-500/60 focus:ring-1 focus:ring-emerald-500/40"
    />
    <div id="filters" class="mt-3 flex flex-wrap items-center gap-2"></div>
  </div>

  <main class="mx-auto w-full max-w-3xl flex-1 px-5 py-8">
    <p id="meta" class="mb-6 text-xs text-zinc-500"></p>
    <div id="posts" class="space-y-4"></div>
    <div id="empty" class="hidden rounded-2xl border border-dashed border-zinc-800 p-10 text-center text-sm text-zinc-500">
      No posts yet — waiting for the first automated run.
    </div>
  </main>

  <footer class="mt-12 border-t border-zinc-800/60">
    <div class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-5 py-6 text-xs text-zinc-500">
      <p>Generated automatically by <a href="https://github.com/watashiii5/Automated-Niche-Micro-Blog-News-Aggregator" target="_blank" rel="noopener" class="text-zinc-400 underline underline-offset-2 hover:text-emerald-300">GitHub Actions + Gemini</a>.</p>
      <p>Hosted free on <a href="https://pages.github.com/" target="_blank" rel="noopener" class="text-zinc-400 underline underline-offset-2 hover:text-emerald-300">GitHub Pages</a></p>
    </div>
  </footer>

  <div id="modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
    <div class="relative max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-2xl border border-zinc-800 bg-zinc-900 p-6 sm:p-8">
      <button id="modal-close" class="absolute right-4 top-4 rounded-full border border-zinc-700 bg-zinc-800 px-2.5 py-0.5 text-sm text-zinc-400 hover:text-zinc-100" aria-label="Close">✕</button>
      <div id="modal-body" class="md-body"></div>
    </div>
  </div>

  <noscript>
    <p class="text-center text-sm text-zinc-500">This page needs JavaScript to load the post index. You can also browse <a href="posts/" class="underline">/posts</a> directly.</p>
  </noscript>

  <script>
    const state = { posts: [], query: "", tag: null };

    async function fetchText(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }

    function makeEl(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function makeCard(post) {
      const card = makeEl(
        "article",
        "group rounded-2xl border border-zinc-800 bg-zinc-900/50 p-5 transition-colors hover:border-emerald-500/50 hover:bg-zinc-900"
      );

      const top = makeEl("div", "flex items-center justify-between text-xs text-zinc-500");
      const time = makeEl("time", "", post.date);
      time.dateTime = post.date;
      top.append(time);
      if (post.source_url) {
        const src = makeEl("a", "inline-flex items-center hover:text-emerald-400", "Source ↗");
        src.href = post.source_url;
        src.target = "_blank";
        src.rel = "noopener noreferrer";
        top.append(src);
      }
      card.append(top);

      card.append(makeEl("h2", "mt-3 text-lg font-semibold leading-snug text-zinc-100", post.title));
      if (post.summary) card.append(makeEl("p", "mt-2 text-sm leading-relaxed text-zinc-400", post.summary));

      const tagsWrap = makeEl("div", "mt-4 flex flex-wrap items-center gap-2");
      (post.tags || []).forEach((t) => {
        const btn = makeEl(
          "button",
          "rounded-full border border-zinc-700/80 bg-zinc-800/60 px-2.5 py-0.5 text-[11px] text-zinc-300 hover:border-emerald-500/60 hover:text-emerald-300 transition-colors",
          "#" + t
        );
        btn.dataset.tag = t;
        btn.addEventListener("click", () => {
          state.tag = state.tag === t ? null : t;
          buildFilters();
          render();
        });
        tagsWrap.append(btn);
      });

      const readBtn = makeEl("button", "ml-auto text-xs font-medium text-emerald-400 hover:text-emerald-300 hover:underline", "Read full post →");
      readBtn.addEventListener("click", () => openPost(post.file));
      tagsWrap.append(readBtn);
      card.append(tagsWrap);
      return card;
    }

    function buildFilters() {
      const wrap = document.getElementById("filters");
      wrap.innerHTML = "";

      const counts = {};
      state.posts.forEach((p) => (p.tags || []).forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
      const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

      const all = makeEl(
        "button",
        "rounded-full border px-3 py-1 text-xs transition-colors " +
          (state.tag === null
            ? "border-emerald-500 bg-emerald-500/10 text-emerald-300"
            : "border-zinc-700 bg-zinc-900 text-zinc-400 hover:text-zinc-200"),
        "All"
      );
      all.addEventListener("click", () => {
        state.tag = null;
        buildFilters();
        render();
      });
      wrap.append(all);

      tags.forEach((t) => {
        const btn = makeEl(
          "button",
          "rounded-full border px-3 py-1 text-xs transition-colors " +
            (state.tag === t
              ? "border-emerald-500 bg-emerald-500/10 text-emerald-300"
              : "border-zinc-700 bg-zinc-900 text-zinc-400 hover:text-zinc-200"),
          "#" + t + " (" + counts[t] + ")"
        );
        btn.addEventListener("click", () => {
          state.tag = state.tag === t ? null : t;
          buildFilters();
          render();
        });
        wrap.append(btn);
      });
    }

    function render() {
      const q = state.query.trim().toLowerCase();
      const list = state.posts.filter((p) => {
        const matchQ =
          !q || (p.title + " " + (p.summary || "") + " " + (p.tags || []).join(" ")).toLowerCase().includes(q);
        const matchT = !state.tag || (p.tags || []).includes(state.tag);
        return matchQ && matchT;
      });

      const container = document.getElementById("posts");
      container.innerHTML = "";
      list.forEach((p) => container.append(makeCard(p)));

      document.getElementById("empty").classList.toggle("hidden", list.length > 0);
      document.getElementById("count").textContent = list.length + " shown of " + state.posts.length;
    }

    function openModal() {
      const modal = document.getElementById("modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      document.body.style.overflow = "";
    }

    async function openPost(file) {
      const body = document.getElementById("modal-body");
      body.textContent = "Loading…";
      openModal();
      try {
        const md = await fetchText(file);
        body.innerHTML = DOMPurify.sanitize(marked.parse(md));
      } catch (e) {
        body.textContent = "Sorry, could not load this post.";
      }
    }

    async function init() {
      const meta = document.getElementById("meta");
      try {
        const data = JSON.parse(await fetchText("index.json"));
        state.posts = data.posts || [];
        meta.textContent = data.generated
          ? data.count + " posts · generated " + data.generated.replace("T", " ").replace("Z", " UTC")
          : "";
        document.getElementById("count").textContent = data.count + " posts";
        buildFilters();
        render();
      } catch (e) {
        meta.textContent = "The index has not been generated yet. Run the aggregator once to publish the first posts.";
        document.getElementById("empty").classList.remove("hidden");
      }
    }

    document.getElementById("search").addEventListener("input", (e) => {
      state.query = e.target.value;
      render();
    });

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modal")) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
