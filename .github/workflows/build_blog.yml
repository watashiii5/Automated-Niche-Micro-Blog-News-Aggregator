name: Build Blog

on:
  schedule:
    # Daily at 06:00 UTC. GitHub schedules crons in UTC.
    # NOTE: GitHub disables scheduled workflows in public repos that are
    # inactive for 60 days — push a commit (or trigger workflow_dispatch) to re-enable.
    - cron: "0 6 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional overrides (see README.md). Uncomment to customize:
          # FEED_URL: https://hnrss.org/frontpage
          # TOPIC: AI tools, open-source AI models, indie hacker launches
          # GEMINI_MODEL: gemini-3.6-flash
          # MAX_POSTS_PER_RUN: "2"
          # SITE_URL: https://<your-user>.github.io/<your-repo>/
        run: python script.py

      - name: Generate login gate (hashed credentials, never committed)
        env:
          # Optional. Without these secrets the blog stays public.
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python script.py --auth

      - name: Commit and push generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — nothing new to publish."
          else
            git commit -m "blog: publish latest aggregated posts"
            git push
          fi

      # Stage only the files that should be served on the site.
      # site_auth.json is generated above from secrets and never committed.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html index.json feed.xml ads_config.js .nojekyll _site/
          cp -r posts _site/
          if [ -f site_auth.json ]; then cp site_auth.json _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
