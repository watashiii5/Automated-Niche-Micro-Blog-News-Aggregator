name: Build Blog

on:
  schedule:
    # Daily at 06:00 UTC. GitHub schedules crons in UTC.
    # NOTE: GitHub disables scheduled workflows in public repos that are
    # inactive for 60 days — push a commit (or trigger workflow_dispatch) to re-enable.
    - cron: "0 6 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional overrides (see README.md). Uncomment to customize:
          # FEED_URL: https://hnrss.org/frontpage
          # TOPIC: AI tools, open-source AI models, indie hacker launches
          # GEMINI_MODEL: gemini-2.5-flash
          # MAX_POSTS_PER_RUN: "2"
          # SITE_URL: https://<your-user>.github.io/<your-repo>/
        run: python script.py

      - name: Commit and push generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — nothing new to publish."
          else
            git commit -m "blog: publish latest aggregated posts"
            git push
          fi
